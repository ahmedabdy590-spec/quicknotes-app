<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes — Capture your thoughts</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-content">
        <p class="eyebrow">A little space for big ideas</p>
        <h1>QuickNotes</h1>
        <p class="tagline">Capture a thought. Find it when you need it.</p>
      </div>
    </header>

    <main>
      <section class="panel" aria-labelledby="add-heading">
        <h2 id="add-heading">Add a note</h2>

        <form id="note-form">
          <div class="field note-field">
            <label for="note-input">Your note</label>
            <input
              id="note-input"
              name="note"
              type="text"
              maxlength="201"
              placeholder="What's on your mind?"
              autocomplete="off"
              aria-describedby="error-message"
            />
          </div>

          <div class="field category-field">
            <label for="note-category">Category</label>
            <select id="note-category" name="category">
              <option value="Personal">Personal</option>
              <option value="Work">Work</option>
              <option value="Study">Study</option>
            </select>
          </div>

          <button class="primary-button" type="submit">Add Note</button>
        </form>

        <p id="error-message" role="alert" aria-live="polite"></p>
      </section>

      <section class="panel notes-panel" aria-labelledby="notes-heading">
        <div class="notes-heading-row">
          <div>
            <p class="eyebrow section-eyebrow">Your collection</p>
            <h2 id="notes-heading">Your notes</h2>
          </div>

          <div class="notes-actions">
            <p id="note-count" aria-live="polite">You have no notes yet.</p>
            <button id="clear-all-button" class="clear-button" type="button">
              Clear all
            </button>
          </div>
        </div>

        <div class="field search-field">
          <label for="search-input">Search notes</label>
          <input
            id="search-input"
            type="search"
            placeholder="Search by note text…"
            autocomplete="off"
          />
        </div>

        <ul id="notes-list" aria-live="polite"></ul>
      </section>
    </main>

    <footer>
      <p>Made for your next bright idea.</p>
    </footer>
  </body>
</html>
